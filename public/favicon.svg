<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <!-- Text/Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bg-grad)" stroke="#818cf8" stroke-width="8" stroke-opacity="0.3" />

  <!-- Technical/Calculator Grid Lines (Subtle) -->
  <path d="M120 24v464M256 24v464M392 24v464M24 120h464M24 256h464M24 392h464" stroke="#818cf8" stroke-width="2" stroke-opacity="0.08" />

  <!-- Outer Ring/Border highlight -->
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="url(#accent-grad)" stroke-width="3" stroke-opacity="0.2" />

  <!-- CM Text with Styling -->
  <text x="50%" y="54%" 
        font-family="'Outfit', 'Segoe UI', Roboto, sans-serif" 
        font-size="200" 
        font-weight="800" 
        fill="url(#accent-grad)" 
        text-anchor="middle" 
        dominant-baseline="middle"
        letter-spacing="-8"
        filter="url(#glow)">CM</text>
        
  <!-- Subtle Calculator/Metric symbol in corner -->
  <rect x="390" y="390" width="40" height="40" rx="8" fill="#818cf8" fill-opacity="0.8" />
  <path d="M400 410h20M410 400v20" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
</svg>
