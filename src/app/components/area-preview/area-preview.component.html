<div class="preview-container">
  <div class="header-row">
    <h2 class="section-title">Visualização 2D</h2>
    <div class="legend">
      <div class="legend-item"><span class="color-dot main"></span> Principal</div>
      <div class="legend-item"><span class="color-dot door"></span> Porta</div>
      <div class="legend-item"><span class="color-dot window"></span> Janela</div>
      <div class="legend-item"><span class="color-dot cutout"></span> Recorte</div>
    </div>
  </div>

  <div class="svg-wrapper">
    <svg 
      [attr.viewBox]="viewBox()" 
      width="100%" 
      height="100%" 
      preserveAspectRatio="xMidYMid meet"
      class="blueprint-svg"
    >
      <defs>
        <marker 
          id="arrow-end" 
          viewBox="0 0 10 10" 
          refX="10" 
          refY="5" 
          markerWidth="6" 
          markerHeight="6" 
          orient="auto"
        >
          <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--text-secondary)" />
        </marker>
        <marker 
          id="arrow-start" 
          viewBox="0 0 10 10" 
          refX="0" 
          refY="5" 
          markerWidth="6" 
          markerHeight="6" 
          orient="auto-start-reverse"
        >
          <path d="M 0 1 L 10 5 L 0 9 z" fill="var(--text-secondary)" />
        </marker>
        <pattern 
          id="grid-pattern" 
          width="1" 
          height="1" 
          patternUnits="userSpaceOnUse"
        >
          <path 
            d="M 1 0 L 0 0 0 1" 
            fill="none" 
            stroke="rgba(255, 255, 255, 0.05)" 
            [attr.stroke-width]="gridStrokeWidth()" 
          />
        </pattern>
      </defs>

      <rect 
        x="0" 
        y="0" 
        [attr.width]="calculatorService.width()" 
        [attr.height]="calculatorService.length()" 
        fill="var(--bg-body)" 
        stroke="var(--color-primary)" 
        stroke-width="0.04" 
        stroke-linejoin="round"
      />

      <rect 
        x="0" 
        y="0" 
        [attr.width]="calculatorService.width()" 
        [attr.height]="calculatorService.length()" 
        fill="url(#grid-pattern)" 
      />

      @for (d of calculatorService.deductions(); track d.id) {
        <g class="deduction-group">
          <rect 
            [attr.x]="d.x" 
            [attr.y]="d.y" 
            [attr.width]="d.width" 
            [attr.height]="d.length" 
            [attr.fill]="getDeductionColor(d.type)" 
            fill-opacity="0.25" 
            [attr.stroke]="getDeductionColor(d.type)" 
            stroke-width="0.03"
            stroke-dasharray="0.08,0.04"
            class="deduction-rect"
          />
          <text 
            [attr.x]="d.x + d.width / 2" 
            [attr.y]="d.y + d.length / 2" 
            text-anchor="middle" 
            dominant-baseline="middle" 
            [attr.font-size]="fontSize() * 0.65" 
            fill="var(--text-light)" 
            font-weight="600"
            class="deduction-label"
          >
            {{ d.name }}
          </text>
        </g>
      }

      <g class="dimensions">
        <line 
          x1="0" 
          y1="-0.25" 
          [attr.x2]="calculatorService.width()" 
          y2="-0.25" 
          stroke="var(--text-secondary)" 
          stroke-width="0.02" 
          marker-start="url(#arrow-start)" 
          marker-end="url(#arrow-end)" 
        />
        <text 
          [attr.x]="calculatorService.width() / 2" 
          y="-0.38" 
          text-anchor="middle" 
          [attr.font-size]="fontSize()" 
          fill="var(--text-dim)" 
          font-weight="500"
        >
          {{ calculatorService.width() }} m
        </text>

        <line 
          x1="-0.25" 
          y1="0" 
          x2="-0.25" 
          [attr.y2]="calculatorService.length()" 
          stroke="var(--text-secondary)" 
          stroke-width="0.02" 
          marker-start="url(#arrow-start)" 
          marker-end="url(#arrow-end)" 
        />
        <text 
          x="-0.38" 
          [attr.y]="calculatorService.length() / 2" 
          text-anchor="middle" 
          [attr.font-size]="fontSize()" 
          fill="var(--text-dim)" 
          font-weight="500"
          [attr.transform]="'rotate(-90, -0.38, ' + (calculatorService.length() / 2) + ')'"
        >
          {{ calculatorService.length() }} m
        </text>
      </g>
    </svg>
  </div>
</div>
